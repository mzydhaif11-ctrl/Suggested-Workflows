name: Pylint Code Quality

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      - name: Analyse code with pylint
        run: |
          pylint --disable=C0301,C0303,C0114,C0115,C0411,W0621,C0412 \
            --fail-under=8 \
            main.py adaptive_memory_engine.py ingest.py rag_engine.py

      - name: Run adaptive memory engine test
        run: python adaptive_memory_engine.py
