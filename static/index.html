<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 موجة البيان | Mowjn AI-Bayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006C35;
            --primary-light: #00A86B;
            --primary-dark: #004D25;
            --accent: #00BCD4;
            --bg-main: #F0F4F3;
            --bg-card: #FFFFFF;
            --bg-user-msg: #E8F5E9;
            --bg-bot-msg: #FFFFFF;
            --text-primary: #1A1A2E;
            --text-secondary: #555;
            --text-muted: #888;
            --border: #E0E0E0;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .header-title h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-title p {
            font-size: 0.75rem;
            opacity: 0.8;
            font-weight: 300;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        /* Messages */
        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: var(--radius);
            line-height: 1.7;
            font-size: 0.95rem;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-start;
            background: var(--bg-user-msg);
            border: 1px solid #C8E6C9;
            border-radius: var(--radius) var(--radius) 4px var(--radius);
        }

        .message.bot {
            align-self: flex-end;
            background: var(--bg-bot-msg);
            border: 1px solid var(--border);
            border-radius: var(--radius) var(--radius) var(--radius) 4px;
            box-shadow: var(--shadow);
        }

        .message-label {
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .message.user .message-label { color: var(--primary); }
        .message.bot .message-label { color: var(--accent); }

        .message-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            gap: 12px;
        }

        .message-meta span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* Welcome Message */
        .welcome {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .welcome h2 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .welcome-features {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .feature-tag {
            background: white;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Input Area */
        .input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #userInput {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            min-height: 50px;
            max-height: 150px;
            direction: rtl;
        }

        #userInput:focus {
            border-color: var(--primary);
        }

        #userInput::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(0,108,53,0.3);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 22px;
            height: 22px;
            transform: rotate(180deg);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
            align-self: flex-end;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary-light);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .message { max-width: 90%; }
            .header { padding: 12px 16px; }
            .input-area { padding: 12px 16px; }
            .welcome-features { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-brand">
            <div class="header-logo">🌊</div>
            <div class="header-title">
                <h1>موجة البيان</h1>
                <p>Mowjn AI-Bayan • نظام ذاكرة سياقية تكيفية</p>
            </div>
        </div>
        <div class="header-status">
            <div class="status-dot"></div>
            <span id="statusText">متصل</span>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container" id="chatContainer">
        <div class="welcome">
            <div class="welcome-icon">🌊</div>
            <h2>مرحبًا بك في موجة البيان</h2>
            <p>
                نظام ذكاء اصطناعي عربي محلي بالكامل — يحفظ خصوصيتك، يتعلم منك، ويفهم لغتك ولهجتك.
                ابدأ المحادثة الآن!
            </p>
            <div class="welcome-features">
                <div class="feature-tag">🔒 خصوصية كاملة</div>
                <div class="feature-tag">🧠 ذاكرة تكيفية</div>
                <div class="feature-tag">🇸🇦 صُنع في السعودية</div>
                <div class="feature-tag">📚 محرك RAG محلي</div>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea
                id="userInput"
                placeholder="اكتب سؤالك هنا..."
                rows="1"
            ></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        let isProcessing = false;

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Send on Enter (Shift+Enter for new line)
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            userInput.value = '';
            userInput.style.height = 'auto';

            // Remove welcome message
            const welcome = chatContainer.querySelector('.welcome');
            if (welcome) welcome.remove();

            // Add user message
            addMessage(message, 'user');

            // Show typing indicator
            const typingEl = showTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) {
                    throw new Error(`خطأ ${response.status}`);
                }

                const data = await response.json();
                typingEl.remove();
                addMessage(data.response, 'bot', {
                    memories: data.memories_used,
                    rag: data.rag_results
                });

            } catch (error) {
                typingEl.remove();
                addMessage(`❌ خطأ في الاتصال: ${error.message}\n\nتأكد أن الخادم يعمل على http://localhost:8000`, 'bot');
            }

            isProcessing = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        function addMessage(text, type, meta = {}) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            const label = type === 'user' ? '👤 أنت' : '🤖 موجة';

            let metaHtml = '';
            if (meta.memories !== undefined) {
                metaHtml = `<div class="message-meta">
                    <span>🧠 ${meta.memories} ذكرى مسترجعة</span>
                    <span>📚 ${meta.rag} نتيجة مرجعية</span>
                </div>`;
            }

            msgDiv.innerHTML = `
                <div class="message-label">${label}</div>
                <div class="message-text">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
                ${metaHtml}
            `;

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const el = document.createElement('div');
            el.className = 'typing-indicator';
            el.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return el;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Check server status on load
        fetch('/api/status')
            .then(r => r.json())
            .then(d => {
                document.getElementById('statusText').textContent = `متصل • ${d.memory_count} ذكرى`;
            })
            .catch(() => {
                document.getElementById('statusText').textContent = 'غير متصل';
                document.getElementById('statusText').previousElementSibling.style.background = '#f44336';
            });
    </script>
</body>
</html>
