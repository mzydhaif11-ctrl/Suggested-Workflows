<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة موجة البيان</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#0f1117;color:#f3f4f8;
  font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;
  display:flex;justify-content:center;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
.app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 20px;text-align:center}
.hidden{display:none!important}

.logo{width:104px;height:104px;border-radius:30px;background:linear-gradient(135deg,#4f8cff,#7c3aed);display:grid;place-items:center;font-size:50px;box-shadow:0 0 70px rgba(79,140,255,.28);margin-bottom:26px}
.logo.sm{width:72px;height:72px;font-size:34px;border-radius:22px;margin-bottom:18px}
h1{font-size:34px;font-weight:800;margin-bottom:18px;background:linear-gradient(90deg,#5b8cff,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{color:#a3a8b8;font-size:17px;line-height:2;margin-bottom:34px}

/* الدخول */
#login{width:100%}
.box{width:100%;background:#171a24;border:1px solid #272c3b;border-radius:24px;padding:22px;text-align:right}
.tabs{display:flex;background:#0f1117;border-radius:14px;padding:4px;margin-bottom:18px}
.tab{flex:1;padding:11px;border:0;background:none;color:#8a90a3;font:inherit;font-size:15px;font-weight:700;border-radius:11px;cursor:pointer}
.tab.on{background:linear-gradient(135deg,#4f8cff,#7c3aed);color:#fff}
label{display:block;font-size:14px;color:#a3a8b8;margin:12px 0 6px}
input{width:100%;background:#0f1117;border:1px solid #272c3b;border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;color:#f3f4f8;outline:none;direction:ltr;text-align:right}
input:focus{border-color:#5b6cff}
.btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#4f8cff,#7c3aed);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.98)}
.err{color:#ff7a7a;font-size:14px;margin-top:12px;min-height:18px}
.guest{margin-top:16px;background:none;border:0;color:#8a90a3;font:inherit;font-size:15px;cursor:pointer;text-decoration:underline}

/* الرئيسية */
#home{width:100%}
.bar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#a3a8b8;font-size:15px}
.out{background:#171a24;border:1px solid #272c3b;color:#f3f4f8;border-radius:12px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#171a24;border:1px solid #272c3b;border-radius:24px;padding:20px;text-align:right;min-height:170px;cursor:pointer;transition:transform .15s,border-color .15s}
.card:active{transform:scale(.97)}
.card:hover{border-color:#5b6cff}
.card .ic{font-size:32px;display:block;margin-bottom:14px}
.card b{display:block;font-size:19px;font-weight:700;margin-bottom:8px}
.card span{display:block;color:#7c8294;font-size:15px;line-height:1.7}
.foot{margin-top:34px;color:#5f6577;font-size:15px;direction:ltr}
</style>
</head>
<body>
<div class="app">

  <!-- شاشة الدخول -->
  <section id="login">
    <div class="logo sm" style="margin-inline:auto">🌊</div>
    <h1 style="font-size:28px;margin-bottom:8px">منصة موجة البيان</h1>
    <p class="desc" style="font-size:15px;margin-bottom:22px">سجّل دخولك عشان تبدأ محادثتك.</p>

    <div class="box">
      <div class="tabs">
        <button class="tab on" id="tIn" type="button">تسجيل الدخول</button>
        <button class="tab" id="tUp" type="button">حساب جديد</button>
      </div>
      <form id="form" autocomplete="on">
        <div id="nameRow" class="hidden">
          <label for="name">الاسم</label>
          <input id="name" type="text" autocomplete="name" style="direction:rtl">
        </div>
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
        <label for="pass">كلمة المرور</label>
        <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
        <div class="err" id="err"></div>
        <button class="btn" id="go" type="submit">دخول</button>
      </form>
    </div>
    <button class="guest" id="guest" type="button">المتابعة كزائر</button>
  </section>

  <!-- الشاشة الرئيسية -->
  <section id="home" class="hidden">
    <div class="bar">
      <span id="hi"></span>
      <button class="out" id="out" type="button">خروج</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="logo">🌊</div>
      <h1>منصة موجة البيان</h1>
