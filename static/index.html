<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة موجة البيان</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #151b2b;
            --bg-user-msg: #4f46e5;
            --bg-ai-msg: #1a2234;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--bg-dark);
            border-bottom: 1px solid #1f2937;
            z-index: 10;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .badge {
            background-color: #059669;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        #main-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 110px;
        }

        #home-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .welcome-title {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(to left, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .card:hover {
            background-color: #1f2937;
            transform: translateY(-2px);
        }

        .suggestions {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .suggestion-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid #1f2937;
            padding: 14px;
            border-radius: 12px;
            text-align: right;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        #chat-view {
            display: none;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 90%;
            word-wrap: break-word;
        }

        .msg-user {
            align-self: flex-start;
            background-color: var(--bg-user-msg);
            padding: 12px 16px;
            border-radius: 16px 16px 0 16px;
            font-size: 1.05rem;
            line-height: 1.6;
        }
        
        .msg-ai {
            align-self: flex-end;
            background-color: var(--bg-ai-msg);
            padding: 12px 16px;
            border-radius: 16px 16px 16px 0;
            border: 1px solid #2d3748;
            font-size: 1.05rem;
        }

        .msg-ai-arbiter {
            align-self: flex-end;
            background-color: var(--bg-ai-msg);
            border: 1px solid #2d3748;
            padding: 16px;
            border-radius: 16px 16px 16px 0;
            width: 100%;
            max-width: 100%;
        }

        .arbiter-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #2d3748;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .winner-badge {
            color: #fbbf24;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* تنسيق الخط والفقرات لقراءة واضحة وكبيرة */
        .model-details {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #f8fafc;
            letter-spacing: 0.2px;
        }

        .model-details strong {
            color: #93c5fd;
            font-weight: 700;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-dark);
            padding: 12px 16px;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .input-container {
            display: flex;
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 4px 14px;
            width: 100%;
            max-width: 800px;
            align-items: center;
        }

        .input-container input {
            flex: 1;
            background: none;
            border: none;
            color: white;
            padding: 12px;
            outline: none;
            font-size: 1.05rem;
        }

        .send-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button onclick="resetHome()" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem;">🔄</button>
            <span class="badge">RAG + Arbiter</span>
        </div>
        <div class="header-title">مستشار موجة البيان التقني</div>
        <div style="width: 24px;"></div>
    </header>

    <div id="main-container">
        <div id="home-view">
            <h1 class="welcome-title">منصة موجة البيان</h1>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 25px; line-height: 1.6;">
                منصتك المتخصصة في الدعم الفني والمقارنة البرمجية بين نماذج<br>
                Google Gemini و DeepSeek مع ذاكرة RAG ومحكم ذكي.
            </p>

            <div class="cards-grid">
                <div class="card" onclick="handleSend('كيف أبدأ مع Python و Gemini؟')">
                    <div style="font-size: 2rem; margin-bottom: 8px;">🐍</div>
                    <h3>البدء مع Python</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">أكواد الربط الرسمية</p>
                </div>
                <div class="card" onclick="handleSend('قارن بين Flash و Pro')">
                    <div style="font-size: 2rem; margin-bottom: 8px;">⚡</div>
                    <h3>Flash vs Pro</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">السرعة مقابل الاستدلال</p>
                </div>
            </div>

            <div class="suggestions">
                <h4 style="color: var(--text-muted); margin-bottom: 6px;">✨ اقتراحات الأسئلة الذكية</h4>
                <button class="suggestion-btn" onclick="handleSend('ما الفرق بين Gemini 3.8 Flash و DeepSeek V3؟')">
                    <span>ما الفرق بين Gemini 3.8 Flash و DeepSeek V3؟</span>
                    <span>←</span>
                </button>
                <button class="suggestion-btn" onclick="handleSend('اكتب لي كود بايثون لاسترجاع البيانات (RAG)')">
                    <span>اكتب لي كود بايثون لاسترجاع البيانات (RAG)</span>
                    <span>←</span>
                </button>
            </div>
        </div>

        <div id="chat-view"></div>
    </div>

    <div class="input-area">
        <div class="input-container">
            <input type="text" id="userInput" placeholder="اكتب سؤالك للتحكيم بين النماذج..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="handleSend()">➤</button>
        </div>
    </div>

    <script>
        const homeView = document.getElementById('home-view');
        const chatView = document.getElementById('chat-view');
        const userInput = document.getElementById('userInput');

        function initChatUI() {
            if (homeView.style.display !== 'none') {
                homeView.style.display = 'none';
                chatView.style.display = 'flex';
            }
        }

        async function handleSend(query = null) {
            const text = query || userInput.value.trim();
            if (!text) return;

            initChatUI();
            addMessage(text, 'user');
            userInput.value = '';

            const loadingId = "loading-" + Date.now();
            addLoadingMessage(loadingId);

            try {
                const response = await fetch('/api/chat', { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text }) 
                });

                const data = await response.json();
                
                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();
                
                addDynamicResponse(data.text || data.response || 'لم يتم العثور على إجابة', data.model || 'Gemini RAG Engine'); 

            } catch (error) {
                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();
                addMessage("عذراً، تعذر الاتصال بالخادم. يرجى المحاولة مرة أخرى.", 'ai');
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') handleSend();
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'msg-user' : 'msg-ai'}`;
            msgDiv.textContent = text;
            chatView.appendChild(msgDiv);
            scrollToBottom();
        }

        function addDynamicResponse(aiText, modelName) {
            const arbiterDiv = document.createElement('div');
            arbiterDiv.className = 'message msg-ai-arbiter';
            
            let formattedText = String(aiText)
                .replace(/\\n/g, '\n')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            
            arbiterDiv.innerHTML = `
                <div class="arbiter-header">
                    <div class="winner-badge">🤖 رد النموذج: ${modelName}</div>
                </div>
                <div class="model-details">
                    <p>${formattedText}</p>
                </div>
            `;
            
            chatView.appendChild(arbiterDiv);
            scrollToBottom();
        }

        function addLoadingMessage(id) {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = id;
            loadingDiv.className = 'message msg-ai';
            loadingDiv.textContent = 'جاري المعالجة والتفكير...';
            loadingDiv.style.opacity = '0.7';
            chatView.appendChild(loadingDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('main-container');
            container.scrollTop = container.scrollHeight;
        }

        function resetHome() {
            chatView.innerHTML = '';
            chatView.style.display = 'none';
            homeView.style.display = 'flex';
        }
    </script>
</body>
</html>
