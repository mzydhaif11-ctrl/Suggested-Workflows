<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة موجة البيان للدعم الفني</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b132b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1c2541;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3a506b;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #6fffe9;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 15px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg-bot {
      background-color: #1c2541;
      color: #e0e1dd;
      align-self: flex-start;
      border-top-right-radius: 2px;
      border: 1px solid #3a506b;
    }
    .msg-user {
      background-color: #0077b6;
      color: #ffffff;
      align-self: flex-end;
      border-top-left-radius: 2px;
    }
    .sources {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #3a506b;
      font-size: 13px;
    }
    .sources a {
      color: #6fffe9;
      text-decoration: none;
      display: block;
      margin-top: 4px;
    }
    footer {
      background-color: #1c2541;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #3a506b;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid #3a506b;
      background-color: #0b132b;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #6fffe9;
    }
    button {
      background-color: #0077b6;
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌊 منصة موجة البيان للدعم الفني</h1>
  </header>

  <div id="chat-box">
    <div class="msg msg-bot">مرحباً بك في منصة موجة البيان للدعم الفني المتخصصة في Gemini API! كيف يمكنني مساعدتك اليوم؟</div>
  </div>

  <footer>
    <input type="text" id="user-input" placeholder="اكتب استفسارك هنا..." onkeypress="handleKey(event)" />
    <button onclick="sendMsg()">إرسال</button>
  </footer>

  <script>
    async function sendMsg() {
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, "msg-user");
      input.value = "";

      const loadingMsg = appendMsg("جاري البحث في الوثائق والرد...", "msg-bot");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text })
        });
        const data = await response.json();
        loadingMsg.remove();

        let botReply = data.answer || "عذراً، لم أتمكن من استخراج رد.";
        if (data.sources && data.sources.length > 0) {
          botReply += "\n\n📌 المصادر الرسمية:";
          data.sources.forEach(s => {
            botReply += `\n• ${s.title}: ${s.url}`;
          });
        }
        appendMsg(botReply, "msg-bot");
      } catch (err) {
        loadingMsg.innerText = "حدث خطأ أثناء الاتصال بالخادم. يرجى المحاولة لاحقاً.";
      }
    }

    function appendMsg(text, className) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${className}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function handleKey(e) {
      if (e.key === "Enter") sendMsg();
    }
  </script>
</body>
</html>
