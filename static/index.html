
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>محادثة موحّدة — Gemini + DeepSeek</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e2230;
    --border: #2a2f3d;
    --text: #e6e8ee;
    --muted: #8a90a2;
    --accent: #4f8cff;
    --user: #2563eb;
    --ai: #1f2433;
    --danger: #ff6b6b;
    --success: #34d399;
  }
  body {
    font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .spacer { flex: 1; }
  select, button, input, textarea {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    outline: none;
    transition: border .15s;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  button {
    cursor: pointer;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.danger { background: var(--danger); border-color: var(--danger); }

  /* Settings Panel */
  .settings {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: none;
    gap: 12px;
    flex-wrap: wrap;
  }
  .settings.open { display: flex; }
  .settings .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 220px; }
  .settings label { font-size: 12px; color: var(--muted); }
  .settings input { width: 100%; }
  .warning {
    font-size: 11px;
    color: #fbbf24;
    padding: 6px 10px;
    background: rgba(251, 191, 36, 0.1);
    border-radius: 6px;
    border: 1px solid rgba(251, 191, 36, 0.2);
    width: 100%;
  }

  /* Chat Area */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 820px;
    width: fit-content;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.7;
    word-wrap: break-word;
    animation: fade .2s ease-out;
    position: relative;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .msg.user {
    align-self: flex-start;
    background: var(--user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-end;
    background: var(--ai);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg .meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .msg.user .meta { color: #cfe0ff; }
  .msg .content { white-space: pre-wrap; }
  .msg .content code {
    background: #0b0d14;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .msg .content pre {
    background: #0b0d14;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg .content pre code { background: none; padding: 0; }
  .msg .content ul, .msg .content ol { padding-right: 20px; margin: 6px 0; }
  .msg .content a { color: var(--accent); text-decoration: underline; }
  .msg .content table { border-collapse: collapse; margin: 8px 0; }
  .msg .content th, .msg .content td { border: 1px solid var(--border); padding: 6px 10px; }
  .msg .content th { background: var(--panel-2); }

  .copy-btn {
    font-size: 11px;
    padding: 2px 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .copy-btn.copied { color: var(--success); border-color: var(--success); }

  .cursor::after {
    content: "▍";
    color: var(--accent);
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 2;
  }
  .empty h2 { color: var(--text); font-size: 20px; margin-bottom: 10px; }

  /* Footer */
  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  footer textarea {
    flex: 1;
    resize: none;
    max-height: 160px;
    min-height: 44px;
    line-height: 1.5;
  }
  footer .send { padding: 12px 20px; }

  /* Loading indicator */
  .loading-dots {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .loading-dots span {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: dotPulse 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a2f3d; border-radius: 8px; }

  @media (max-width: 600px) {
    .msg { max-width: 95%; }
    header h1 { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>🤖 محادثة موحّدة</h1>
  <span class="badge" id="providerBadge">DeepSeek</span>
  <div class="spacer"></div>
  <select id="provider">
    <option value="deepseek">DeepSeek</option>
    <option value="gemini">Gemini</option>
  </select>
  <select id="model"></select>
  <button class="ghost" id="regenerateBtn" disabled>🔄 إعادة</button>
  <button class="ghost" id="settingsBtn">⚙️ الإعدادات</button>
  <button class="ghost danger" id="clearBtn">🗑️ مسح</button>
</header>

<section class="settings" id="settings">
  <div class="field">
    <label>DeepSeek API Key</label>
    <input type="password" id="dsKey" placeholder="sk-..." />
  </div>
  <div class="field">
    <label>Gemini API Key</label>
    <input type="password" id="gmKey" placeholder="AIza..." />
  </div>
  <div class="field">
    <label>System Prompt (اختياري)</label>
    <input type="text" id="sysPrompt" value="أنت مساعد ذكي. أجب بالعربية بوضوح وإيجاز." />
  </div>
  <div class="warning">
    ⚠️ المفاتيح تُحفظ محليًا على جهازك فقط. لا تشاركها مع أحد.
  </div>
</section>

<main id="chat">
  <div class="empty" id="empty">
    <h2>ابدأ المحادثة 👋</h2>
    <p>اختر المزوّد من الأعلى، ثم اكتب رسالتك بالأسفل.</p>
    <p style="font-size:12px;">لا تنسَ إضافة مفاتيح API من ⚙️ الإعدادات.</p>
  </div>
</main>

<footer>
  <textarea id="input" rows="1" placeholder="اكتب رسالتك... (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
  <button class="send" id="sendBtn">إرسال</button>
</footer>

<script>
/* =========================================================
   النماذج المتاحة
========================================================= */
const MODELS = {
  deepseek: [
    { id: "deepseek-chat",     name: "DeepSeek Chat" },
    { id: "deepseek-reasoner", name: "DeepSeek Reasoner" }
  ],
  gemini: [
    { id: "gemini-2.0-flash",       name: "Gemini 2.0 Flash" },
    { id: "gemini-2.0-pro-exp-02-05", name: "Gemini 2.0 Pro (Experimental)" }
  ]
};

/* =========================================================
   الحالة العامة
========================================================= */
const state = {
  provider: "deepseek",
  model: "deepseek-chat",
  history: { deepseek: [], gemini: [] },
  streaming: false,
  lastUserMsg: null
};

/* =========================================================
   عناصر DOM
========================================================= */
const $ = (id) => document.getElementById(id);
const chatEl      = $("chat");
const emptyEl     = $("empty");
const inputEl     = $("input");
const sendBtn     = $("sendBtn");
const providerEl  = $("provider");
const modelEl     = $("model");
const badgeEl     = $("providerBadge");
const settingsEl  = $("settings");
const dsKeyEl     = $("dsKey");
const gmKeyEl     = $("gmKey");
const sysPromptEl = $("sysPrompt");
const regenBtn    = $("regenerateBtn");

/* =========================================================
   تحميل/حفظ الإعدادات
========================================================= */
function loadSettings() {
  dsKeyEl.value = localStorage.getItem("dsKey") || "";
  gmKeyEl.value = localStorage.getItem("gmKey") || "";
  sysPromptEl.value = localStorage.getItem("sysPrompt") ||
    "أنت مساعد ذكي. أجب بالعربية بوضوح وإيجاز.";
  const p = localStorage.getItem("provider");
  const m = localStorage.getItem("model");
  if (p && MODELS[p]) state.provider = p;
  if (m) state.model = m;
}
function saveSettings() {
  localStorage.setItem("dsKey", dsKeyEl.value.trim());
  localStorage.setItem("gmKey", gmKeyEl.value.trim());
  localStorage.setItem("sysPrompt", sysPromptEl.value);
  localStorage.setItem("provider", state.provider);
  localStorage.setItem("model", state.model);
}

/* =========================================================
   تعبئة قائمة النماذج
========================================================= */
function refreshModels() {
  const list = MODELS[state.provider];
  modelEl.innerHTML = "";
  list.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.name;
    if (m.id === state.model) opt.selected = true;
    modelEl.appendChild(opt);
  });
  if (!list.find(m => m.id === state.model)) {
    state.model = list[0].id;
    modelEl.value = state.model;
  }
  badgeEl.textContent = state.provider === "deepseek" ? "DeepSeek" : "Gemini";
}

/* =========================================================
   أدوات العرض
========================================================= */
function escapeHTML(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(text) {
  try {
    return marked.parse(text);
  } catch {
    return `<pre>${escapeHTML(text)}</pre>`;
  }
}

function addMessage(role, text, provider) {
  if (emptyEl) emptyEl.remove();
  const wrap = document.createElement("div");
  wrap.className = `msg ${role === "user" ? "user" : "ai"}`;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = role === "user" ? "أنت" :
    (provider === "gemini" ? "Gemini" : "DeepSeek");

  // زر النسخ للردود
  if (role !== "user") {
    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-btn";
    copyBtn.textContent = "نسخ";
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(wrap.dataset.raw || "").then(() => {
        copyBtn.textContent = "تم ✓";
        copyBtn.classList.add("copied");
        setTimeout(() => { copyBtn.textContent = "نسخ"; copyBtn.classList.remove("copied"); }, 2000);
      });
    });
    meta.appendChild(copyBtn);
  }

  const content = document.createElement("div");
  content.className = "content";
  content.innerHTML = text ? renderMarkdown(text) : "";
  wrap.dataset.raw = text || "";

  wrap.appendChild(meta);
  wrap.appendChild(content);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return content;
}

/* =========================================================
   DeepSeek API
========================================================= */
async function callDeepSeek(messages, onDelta) {
  const key = dsKeyEl.value.trim();
  if (!key) throw new Error("مفتاح DeepSeek API غير موجود. أضفه من الإعدادات.");

  const res = await fetch("https://api.deepseek.com/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${key}`
    },
    body: JSON.stringify({ model: state.model, messages, stream: true })
  });

  if (!res.ok) {
    const err = await res.text().catch(() => "");
    throw new Error(`DeepSeek ${res.status}: ${err.slice(0, 200)}`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", full = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();

    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed.startsWith("data:")) continue;
      const data = trimmed.slice(5).trim();
      if (data === "[DONE]") continue;
      try {
        const json = JSON.parse(data);
        const delta = json.choices?.[0]?.delta?.content || "";
        if (delta) { full += delta; onDelta(full); }
      } catch (_) {}
    }
  }
  return full;
}

/* =========================================================
   Gemini API — الصيغة الصحيحة
========================================================= */
async function callGemini(messages, onDelta) {
  const key = gmKeyEl.value.trim();
  if (!key) throw new Error("مفتاح Gemini API غير موجود. أضفه من الإعدادات.");

  // تحويل السجل إلى صيغة Gemini contents[]
  const contents = [];
  for (const m of messages) {
    if (m.role === "system") continue;
    contents.push({
      role: m.role === "assistant" ? "model" : "user",
      parts: [{ text: m.content }]
    });
  }

  const sysMsg = messages.find(m => m.role === "system");
  const body = {
    contents,
    generationConfig: { temperature: 0.7, topK: 40, topP: 0.95 }
  };
  if (sysMsg?.content) {
    body.systemInstruction = { parts: [{ text: sysMsg.content }] };
  }

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${state.model}:streamGenerateContent?key=${encodeURIComponent(key)}`;

  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.text().catch(() => "");
    throw new Error(`Gemini ${res.status}: ${err.slice(0, 300)}`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", full = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();

    for (const line of lines) {
      try {
        const json = JSON.parse(line.trim());
        const text = json.candidates?.[0]?.content?.parts?.[0]?.text || "";
        if (text) { full += text; onDelta(full); }
      } catch (_) {}
    }
  }
  return full;
}

/* =========================================================
   الإرسال الرئيسي
========================================================= */
async function send() {
  const text = inputEl.value.trim();
  if (!text || state.streaming) return;

  state.streaming = true;
  state.lastUserMsg = text;
  sendBtn.disabled = true;
  regenBtn.disabled = true;
  inputEl.value = "";
  inputEl.style.height = "auto";

  addMessage("user", text, state.provider);

  const sys = sysPromptEl.value.trim();
  const history = state.history[state.provider];
  const messages = [];
  if (sys) messages.push({ role: "system", content: sys });
  messages.push(...history);
  messages.push({ role: "user", content: text });

  const aiContent = addMessage("assistant", "", state.provider);
  aiContent.classList.add("cursor");

  try {
    const onDelta = (partial) => {
      aiContent.innerHTML = renderMarkdown(partial);
      chatEl.scrollTop = chatEl.scrollHeight;
    };

    let reply;
    if (state.provider === "deepseek") {
      reply = await callDeepSeek(messages, onDelta);
    } else {
      reply = await callGemini(messages, onDelta);
    }

    if (!reply) reply = "(لم يُرجع النموذج أي رد)";

    state.history[state.provider].push({ role: "user", content: text });
    state.history[state.provider].push({ role: "assistant", content: reply });

    if (state.history[state.provider].length > 20) {
      state.history[state.provider] = state.history[state.provider].slice(-20);
    }

    regenBtn.disabled = false;
  } catch (err) {
    aiContent.innerHTML = `<span style="color:var(--danger);">❌ ${escapeHTML(err.message)}</span>`;
    console.error(err);
  } finally {
    aiContent.classList.remove("cursor");
    state.streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

/* =========================================================
   إعادة التوليد
========================================================= */
async function regenerate() {
  if (!state.lastUserMsg || state.streaming) return;
  // إزالة آخر رد من السجل وعرضه
  const msgs = chatEl.querySelectorAll(".msg");
  if (msgs.length > 0) msgs[msgs.length - 1].remove();
  state.history[state.provider].pop(); // حذف آخر رد AI
  state.history[state.provider].pop(); // حذف آخر رسالة مستخدم
  state.lastUserMsg = null;
  send(); // إعادة إرسال
}

/* =========================================================
   الأحداث
========================================================= */
providerEl.addEventListener("change", () => {
  state.provider = providerEl.value;
  state.model = MODELS[state.provider][0].id;
  refreshModels();
  saveSettings();
  renderHistory();
});
modelEl.addEventListener("change", () => {
  state.model = modelEl.value;
  saveSettings();
});
$("settingsBtn").addEventListener("click", () => settingsEl.classList.toggle("open"));
$("clearBtn").addEventListener("click", () => {
  if (!confirm("سيتم مسح المحادثة الحالية. متابعة؟")) return;
  state.history[state.provider] = [];
  state.lastUserMsg = null;
  regenBtn.disabled = true;
  chatEl.innerHTML = "";
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.id = "empty";
  empty.innerHTML = `<h2>محادثة جديدة مع ${state.provider === "gemini" ? "Gemini" : "DeepSeek"} 👋</h2><p>اكتب رسالتك للبدء.</p>`;
  chatEl.appendChild(empty);
});
regenBtn.addEventListener("click", regenerate);
sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});
dsKeyEl.addEventListener("change", saveSettings);
gmKeyEl.addEventListener("change", saveSettings);
sysPromptEl.addEventListener("change", saveSettings);

function renderHistory() {
  chatEl.innerHTML = "";
  const history = state.history[state.provider];
  if (history.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.id = "empty";
    empty.innerHTML = `<h2>محادثة جديدة مع ${state.provider === "gemini" ? "Gemini" : "DeepSeek"} 👋</h2><p>اكتب رسالتك للبدء.</p>`;
    chatEl.appendChild(empty);
    return;
  }
  history.forEach(m => {
    addMessage(m.role === "user" ? "user" : "assistant", m.content, state.provider);
  });
  regenBtn.disabled = false;
}

/* =========================================================
   التهيئة
========================================================= */
(function init() {
  loadSettings();
  providerEl.value = state.provider;
  refreshModels();
  modelEl.value = state.model;
  renderHistory();
  inputEl.focus();
})();
</script>
</body>
</html>
