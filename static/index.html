<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة موجة البيان للدعم الفني</title>
  <!-- مكتبة تحويل نصوص الماركداون -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b132b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1c2541;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3a506b;
    }
    header h1 {
      font-size: 17px;
      font-weight: 700;
      color: #6fffe9;
    }
    .clear-btn {
      background-color: transparent;
      border: 1px solid #3a506b;
      color: #a0aec0;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .clear-btn:active {
      background-color: #3a506b;
      color: #ffffff;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.7;
      font-size: 15px;
      word-wrap: break-word;
    }
    .msg-bot {
      background-color: #1c2541;
      color: #edf2f7;
      align-self: flex-start;
      border-top-right-radius: 2px;
      border: 1px solid #3a506b;
    }
    .msg-user {
      background-color: #0077b6;
      color: #ffffff;
      align-self: flex-end;
      border-top-left-radius: 2px;
    }
    /* تنسيق نصوص Markdown داخل الرسائل */
    .msg-bot p {
      margin-bottom: 8px;
    }
    .msg-bot p:last-child {
      margin-bottom: 0;
    }
    .msg-bot strong {
      color: #6fffe9;
    }
    .msg-bot ul, .msg-bot ol {
      margin: 8px 18px 8px 0;
    }
    .msg-bot li {
      margin-bottom: 4px;
    }
    .msg-bot code {
      background-color: #0b132b;
      color: #ffd166;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      direction: ltr;
      display: inline-block;
    }
    .msg-bot pre {
      background-color: #0b132b;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      direction: ltr;
      border: 1px solid #3a506b;
    }
    .msg-bot pre code {
      padding: 0;
      background: none;
    }
    .sources {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #3a506b;
      font-size: 13px;
    }
    .sources a {
      color: #6fffe9;
      text-decoration: none;
      display: block;
      margin-top: 4px;
    }
    /* قسم الأزرار السريعة */
    .quick-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 16px;
      background-color: #0f1c3f;
      border-top: 1px solid #233554;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .quick-chips::-webkit-scrollbar {
      display: none;
    }
    .chip {
      background-color: #1c2541;
      border: 1px solid #3a506b;
      color: #6fffe9;
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chip:active {
      background-color: #0077b6;
      color: #ffffff;
    }
    footer {
      background-color: #1c2541;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #3a506b;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid #3a506b;
      background-color: #0b132b;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #6fffe9;
    }
    button.send-btn {
      background-color: #0077b6;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button.send-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌊 منصة موجة البيان للدعم الفني</h1>
    <button class="clear-btn" onclick="clearChat()">مسح المحادثة 🗑️</button>
  </header>

  <div id="chat-box">
    <div class="msg msg-bot">
      مرحباً بك في <strong>منصة موجة البيان للدعم الفني</strong> المتخصصة في Google Gemini API! يمكنك كتابة استفسارك مباشرة أو اختيار أحد الأسئلة المقترحة أدناه:
    </div>
  </div>

  <!-- أشرطة الأسئلة السريعة -->
  <div class="quick-chips">
    <button class="chip" onclick="askQuick('ما هي النماذج المتوفرة في Gemini API؟')">✨ ما هي النماذج المتوفرة؟</button>
    <button class="chip" onclick="askQuick('كيف أبدأ استخدام Gemini API مع Python؟')">🐍 البدء مع Python</button>
    <button class="chip" onclick="askQuick('ما الفرق بين Gemini 1.5 Pro و Flash؟')">⚡ الفرق بين Pro و Flash</button>
    <button class="chip" onclick="askQuick('ما هي حدود الاستخدام والمعدلات Rate Limits؟')">📊 حدود الاستخدام والأسعار</button>
  </div>

  <footer>
    <input type="text" id="user-input" placeholder="اكتب استفسارك هنا..." onkeypress="handleKey(event)" />
    <button class="send-btn" onclick="sendMsg()">إرسال</button>
  </footer>

  <script>
    async function sendMsg() {
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, "msg-user", false);
      input.value = "";

      const loadingMsg = appendMsg("جاري استرجاع الوثائق وتوليد الرد...", "msg-bot", false);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text })
        });
        const data = await response.json();
        loadingMsg.remove();

        let rawAnswer = data.answer || "عذراً، لم أتمكن من الحصول على إجابة.";
        let htmlContent = marked.parse(rawAnswer);

        if (data.sources && data.sources.length > 0) {
          htmlContent += '<div class="sources"><strong>📌 المصادر الرسمية:</strong>';
          data.sources.forEach(s => {
            htmlContent += `<a href="${s.url}" target="_blank">🔗 ${s.title}</a>`;
          });
          htmlContent += '</div>';
        }

        appendMsg(htmlContent, "msg-bot", true);
      } catch (err) {
        loadingMsg.innerText = "تعذر الاتصال بالخادم. يرجى إعادة المحاولة.";
      }
    }

    function appendMsg(content, className, isHTML) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${className}`;
      if (isHTML) {
        msgDiv.innerHTML = content;
      } else {
        msgDiv.textContent = content;
      }
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function askQuick(question) {
      document.getElementById("user-input").value = question;
      sendMsg();
    }

    function clearChat() {
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = `
        <div class="msg msg-bot">
          تم بدء محادثة جديدة. مرحباً بك في <strong>منصة موجة البيان للدعم الفني</strong>! كيف يمكنني خدمتك؟
        </div>
      `;
    }

    function handleKey(e) {
      if (e.key === "Enter") sendMsg();
    }
  </script>
</body>
</html>
