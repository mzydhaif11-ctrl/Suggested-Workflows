<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>منصة موجة البيان | الدعم الفني للذكاء الاصطناعي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0c0f17;
      --card-bg: #151924;
      --card-border: #262c3d;
      --primary: #4f8cff;
      --purple: #7c3aed;
      --success: #10b981;
      --text: #f3f4f8;
      --text-muted: #8e95a8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      background: var(--bg-dark);
      color: var(--text);
    }
    body {
      display: flex;
      justify-content: center;
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    }
    .hidden { display: none !important; }

    /* الشاشة الرئيسية */
    #home {
      width: 100%;
      max-width: 520px;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px 20px;
      text-align: center;
    }
    .hero-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }
    .logo-badge {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: grid;
      place-items: center;
      font-size: 46px;
      box-shadow: 0 12px 35px rgba(79, 140, 255, 0.35);
      margin-bottom: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .logo-badge:hover { transform: scale(1.04); }
    h1 {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .desc {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.8;
      max-width: 440px;
      margin-bottom: 24px;
    }
    .grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 18px 16px;
      text-align: right;
      min-height: 145px;
      cursor: pointer;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }
    .card:hover {
      border-color: #5b6cff;
      background: #1b202e;
      transform: translateY(-2px);
    }
    .card .ic { font-size: 26px; margin-bottom: 8px; }
    .card b { font-size: 16px; font-weight: 700; margin-bottom: 4px; display: block; }
    .card span { color: var(--text-muted); font-size: 12px; line-height: 1.5; display: block; }

    /* شريط الإرسال السريع مع تجربة التحميل */
    .quick-bar {
      width: 100%;
      background: #131722;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 6px 8px 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .quick-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }
    .quick-input::placeholder { color: #5a6275; }
    .btn-submit {
      padding: 10px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: #fff;
      border: none;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-submit:hover:not(:disabled) { opacity: 0.95; transform: scale(1.02); }
    .btn-submit:disabled { opacity: 0.8; cursor: wait; }

    /* دوران التحميل CSS Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* شريط رسالة النجاح */
    .success-alert {
      display: none;
      width: 100%;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
      animation: fadeInScale 0.3s ease;
    }
    .success-alert.show {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .foot { color: #5f6577; font-size: 12px; margin-top: auto; }

    /* شاشة الدردشة والمحادثة */
    #chat {
      width: 100%;
      max-width: 520px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
      background: #111520;
    }
    .top-left { display: flex; align-items: center; gap: 10px; }
    .back {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #171b26;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .mini {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: grid;
      place-items: center;
      font-size: 17px;
    }
    .top b { font-size: 15px; }
    .top small { display: block; color: var(--text-muted); font-size: 11px; }

    #msgs { flex: 1; overflow-y: auto; padding: 16px; }
    .m {
      max-width: 86%;
      padding: 12px 16px;
      border-radius: 18px;
      margin: 10px 0;
      line-height: 1.8;
      font-size: 14.5px;
      white-space: pre-wrap;
      animation: msgIn 0.25s;
    }
    .me {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border-bottom-left-radius: 4px;
      margin-right: auto;
    }
    .bot {
      background: #181d2a;
      border: 1px solid var(--card-border);
      border-bottom-right-radius: 4px;
      margin-left: auto;
    }
    .bot pre {
      direction: ltr;
      text-align: left;
      background: #090c14;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      color: #a5b4fc;
      overflow-x: auto;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } }

    form.chat-form {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--card-border);
      background: #111520;
    }
    .chat-input {
      flex: 1;
      background: #171b26;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .chat-input:focus { border-color: #5b6cff; }

    /* النوافذ المنبثقة التفاعلية للبطاقات */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      width: 100%;
      max-width: 520px;
      background: #111522;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px 28px 0 0;
      padding: 24px 20px;
      max-height: 85vh;
      overflow-y: auto;
      text-align: right;
    }
    .modal-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 14px;
    }
    .btn-close {
      background: #1b202e;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- الشاشة الرئيسية -->
  <section id="home">
    <div class="hero-top">
      <div class="logo-badge" onclick="openChat()">🌊</div>
      <h1>منصة موجة البيان</h1>
      <p class="desc">
        منصتك المتخصصة في الدعم الفني لنماذج الذكاء الاصطناعي من Google Gemini و DeepSeek. اختر سؤالاً مقترحًا أو ابدأ محادثتك مباشرة.
      </p>
    </div>

    <!-- البطاقات الأربع التفاعلية -->
    <div class="grid">
      <button class="card" onclick="openInfoModal('models')">
        <span class="ic">✨</span>
        <b>النماذج المتوفرة</b>
        <span>تعرف على أحدث إصدارات Gemini ومقارنتها</span>
      </button>

      <button class="card" onclick="openInfoModal('python')">
        <span class="ic">🐍</span>
        <b>البدء مع Python</b>
        <span>مثال عملي لربط Gemini بـ Python</span>
      </button>

      <button class="card" onclick="openInfoModal('flash')">
        <span class="ic">⚡</span>
        <b>Flash vs Pro</b>
        <span>مقارنة شاملة بين النماذج</span>
      </button>

      <button class="card" onclick="openInfoModal('limits')">
        <span class="ic">📊</span>
        <b>الحدود والأسعار</b>
        <span>تفاصيل الأسعار والقيود لكل نموذج</span>
      </button>
    </div>

    <!-- شريط الإرسال السريع مع تجربة محاكاة التحميل 3 ثوانٍ -->
    <form class="quick-bar" id="quickForm" onsubmit="handleQuickSubmit(event)">
      <input type="text" id="quickInput" class="quick-input" placeholder="اكتب سؤالك التقني هنا..." required />
      <button type="submit" id="quickBtn" class="btn-submit">
        <span id="quickBtnText">إرسال</span>
        <div id="quickSpinner" class="spinner" style="display: none;"></div>
      </button>
    </form>

    <!-- تنبيه تم الإرسال بنجاح -->
    <div id="successAlert" class="success-alert">
      <span>✓</span>
      <span>تم الإرسال بنجاح (اكتملت المحاكاة خلال 3 ثوانٍ)</span>
    </div>

    <div class="foot">2026 © موجة البيان • Powered by Gemini 3.8 Flash</div>
  </section>

  <!-- شاشة المحادثة المباشرة -->
  <section id="chat" class="hidden">
    <div class="top">
      <div class="top-left">
        <button class="back" onclick="closeChat()">→</button>
        <div class="mini">🌊</div>
        <div>
          <b>مستشار موجة البيان</b>
          <small id="chatStatus">متصل بمحرك RAG</small>
        </div>
      </div>
      <button class="btn-close" onclick="closeChat()">الرئيسية</button>
    </div>

    <div id="msgs"></div>

    <form class="chat-form" id="chatForm" onsubmit="handleChatSubmit(event)">
      <input id="chatInput" class="chat-input" placeholder="اكتب استفسارك للذكاء الاصطناعي…" autocomplete="off" />
      <button type="submit" id="chatBtn" class="btn-submit">
        <span id="chatBtnText">إرسال</span>
        <div id="chatSpinner" class="spinner" style="display: none;"></div>
      </button>
    </form>
  </section>

  <!-- نافذة تفاصيل البطاقات المنبثقة -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeInfoModal(event)">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const msgs = $('msgs');

    /* محتوى البطاقات الأربع التفاعلية */
    const cardData = {
      models: {
        title: '✨ النماذج المتوفرة وأحدث الإصدارات',
        body: `
          <p style="font-size: 13.5px; line-height: 1.8; color: #cbd5e1; margin-bottom: 12px;">
            • <strong>Gemini 3.8 Flash:</strong> فائق السرعة والاقتصاد، زمن استجابة قياسي بسياق 1,000,000 رمز.<br>
            • <strong>Gemini 3.1 Pro:</strong> الأقوى في التفكير المنطقي والهندسة البرمجية بسياق 2,000,000 رمز.<br>
            • <strong>Gemini 3.1 Flash-Lite:</strong> الخيار الاقتصادي للمهام الضخمة المتكررة.<br>
            • <strong>DeepSeek V3 / R1:</strong> نماذج مفتوحة الأوزان بمعمارية خليط الخبراء (MoE).
          </p>
          <button class="btn-submit" onclick="askAiFromModal('قارن بين أحدث نماذج Gemini و DeepSeek')">اسأل المستشار عن النماذج</button>
        `
      },
      python: {
        title: '🐍 البدء مع Python و SDK الرسمي',
        body: `
          <p style="font-size: 13px; color: #94a3b8; margin-bottom: 8px;">تثبيت المكتبة الحديثة واستدعاء النموذج:</p>
          <pre style="direction: ltr; text-align: left; background: #090c14; padding: 12px; border-radius: 12px; font-family: monospace; font-size: 12px; color: #a5b4fc;"># pip install google-genai
from google import genai
import os

client = genai.Client(api_key=os.environ.get("GEMINI_API_KEY"))
response = client.models.generate_content(
    model="gemini-3.8-flash",
    contents="اكتب دالة بايثون لحساب متتالية فيبوناتشي",
)
print(response.text)</pre>
          <button class="btn-submit" style="margin-top: 12px;" onclick="askAiFromModal('أعطني مثال عملي بالبث المباشر Streaming في بايثون')">طلب كود Streaming</button>
        `
      },
      flash: {
        title: '⚡ مقارنة شاملة: Flash مقابل Pro',
        body: `
          <p style="font-size: 13.5px; line-height: 1.8; color: #cbd5e1; margin-bottom: 12px;">
            • <strong>السرعة:</strong> Flash يستجيب في 0.3 إلى 0.6 ثانية مقارنة بـ 1.5 - 3 ثوانٍ لـ Pro.<br>
            • <strong>التكلفة:</strong> Flash أوفر بنسبة 92% وهو الخيار الأنسب لـ 85% من التطبيقات.<br>
            • <strong>التعقيد:</strong> يتفوق Pro في المهام الحسابية، كتابة الأكواد الكبيرة، واستخراج البيانات الدقيقة.<br>
            • <strong>التوجيه الذكي:</strong> ينصح باستقبال الطلبات بـ Flash وتحويل المهام الصعبة فقط إلى Pro.
          </p>
          <button class="btn-submit" onclick="askAiFromModal('كيف أطبق التوجيه الذكي Model Routing بين Flash و Pro؟')">شرح معمارية Model Routing</button>
        `
      },
      limits: {
        title: '📊 الحدود والأسعار وحصص الاستخدام',
        body: `
          <p style="font-size: 13.5px; line-height: 1.8; color: #cbd5e1; margin-bottom: 12px;">
            • <strong>الخطة المجانية في AI Studio:</strong> حتى 15 طلب/دقيقة و 1,500 طلب يومياً مجاناً.<br>
            • <strong>Gemini 3.8 Flash:</strong> $0.10 لكل مليون رمز إدخال و $0.40 لكل مليون رمز إخراج.<br>
            • <strong>Gemini 3.1 Pro:</strong> $1.25 لكل مليون رمز إدخال.<br>
            • <strong>ميزة Context Caching:</strong> تخفيض حتى 75% من تكلفة المدخلات الطويلة المتكررة.
          </p>
          <button class="btn-submit" onclick="askAiFromModal('كيف أستفيد من ميزة Context Caching لتقليل الفاتورة؟')">استفسار عن التخفيضات</button>
        `
      }
    };

    /* فتح وإغلاق النوافذ المنبثقة للبطاقات */
    function openInfoModal(key) {
      const data = cardData[key];
      if (!data) return;
      $('modalContent').innerHTML = `
        <div class="modal-hdr">
          <h3>${data.title}</h3>
          <button class="btn-close" onclick="$('modalOverlay').classList.remove('active')">إغلاق</button>
        </div>
        <div>${data.body}</div>
      `;
      $('modalOverlay').classList.add('active');
    }

    function closeInfoModal(e) {
      if (e.target === $('modalOverlay')) {
        $('modalOverlay').classList.remove('active');
      }
    }

    /* 1. تجربة زر الإرسال مع محاكاة التحميل 3 ثوانٍ */
    function handleQuickSubmit(e) {
      e.preventDefault();
      const input = $('quickInput');
      const val = input.value.trim();
      if (!val) return;

      const btn = $('quickBtn');
      const btnText = $('quickBtnText');
      const spinner = $('quickSpinner');
      const alertBox = $('successAlert');

      // تفعيل حالة الدوران
      btn.disabled = true;
      btnText.textContent = 'جاري التحميل...';
      spinner.style.display = 'block';
      alertBox.classList.remove('show');

      // محاكاة عملية التحميل لـ 3 ثوانٍ (3000ms)
      setTimeout(() => {
        spinner.style.display = 'none';
        btnText.textContent = 'تم الإرسال';
        btn.disabled = false;
        alertBox.classList.add('show');

        // بعد ظهور رسالة النجاح، فتح شاشة المحادثة بالاستفسار
        setTimeout(() => {
          openChat();
          sendQueryToBackend(val);
          input.value = '';
          btnText.textContent = 'إرسال';
        }, 1200);
      }, 3000);
    }

    /* الانتقال إلى شاشة المحادثة */
    function openChat() {
      $('home').classList.add('hidden');
      $('chat').classList.remove('hidden');
      if (msgs.children.length === 0) {
        addMessage('أهلاً بك في منصة موجة البيان للدعم الفني للذكاء الاصطناعي! 👋\nأنا جاهز للإجابة على استفساراتك البرمجية حول Gemini و DeepSeek.', 'bot');
      }
    }

    function closeChat() {
      $('chat').classList.add('hidden');
      $('home').classList.remove('hidden');
    }

    function askAiFromModal(promptText) {
      $('modalOverlay').classList.remove('active');
      openChat();
      sendQueryToBackend(promptText);
    }

    /* إضافة فقاعة محادثة */
    function addMessage(text, role, code) {
      const d = document.createElement('div');
      d.className = 'm ' + role;
      d.textContent = text;
      if (code) {
        const c = document.createElement('pre');
        c.textContent = code;
        d.appendChild(c);
      }
      msgs.appendChild(d);
      msgs.scrollTop = msgs.scrollHeight;
      return d;
    }

    /* 2. إرسال المحادثة والربط بـ FastAPI backend (/api/chat) */
    async function sendQueryToBackend(queryText) {
      addMessage(queryText, 'me');
      const waiting = addMessage('جاري التفكير وصياغة الحل…', 'bot');

      try {
        // استدعاء endpoint خادم FastAPI في main.py
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: queryText })
        });

        if (response.ok) {
          const data = await response.json();
          waiting.textContent = data.answer || data.response || JSON.stringify(data);
        } else {
          // استجابة ذكية احتياطية
          waiting.textContent = getOfflineFallback(queryText);
        }
      } catch (err) {
        // استجابة احتياطية في حال العمل كملف محلي
        waiting.textContent = getOfflineFallback(queryText);
      }
      msgs.scrollTop = msgs.scrollHeight;
    }

    function handleChatSubmit(e) {
      e.preventDefault();
      const input = $('chatInput');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      sendQueryToBackend(val);
    }

    /* الردود الذكية الاحتياطية */
    function getOfflineFallback(query) {
      const q = query.toLowerCase();
      if (q.includes('python') || q.includes('بايثون') || q.includes('كود')) {
        return "للربط مع بايثون:\n1. ثبّت المكتبة: pip install google-genai\n2. استخدم النموذج: gemini-3.8-flash\n3. للـ Streaming استخدم client.models.generate_content_stream";
      }
      if (q.includes('flash') || q.includes('pro') || q.includes('فرق')) {
        return "المقارنة الميدانية:\n• Flash: سريع جداً (0.4s) واقتصادي، ممتاز لخدمات العملاء والشات.\n• Pro: مخصص للاستدلال العميق وحل البرمجيات المعقدة.";
